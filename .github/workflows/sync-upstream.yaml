name: Sync upstream develop

on:
  schedule:
    - cron: '0 6 * * 1'  # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: develop
          # Push with a PAT (if configured) so the branch push triggers build.yaml.
          # Pushes made with the default GITHUB_TOKEN do NOT trigger workflow runs
          # (GitHub suppresses them to prevent recursion). Falls back to the default
          # token when SYNC_PAT is unset — the bot still runs, just without pre-merge CI.
          token: ${{ secrets.SYNC_PAT || github.token }}

      - name: Configure git identity
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/comictagger/comictagger.git
          git fetch upstream +refs/heads/develop:refs/remotes/upstream/develop

      - name: Count new upstream commits
        id: check
        run: |
          set -euo pipefail
          count=$(git rev-list --count develop..upstream/develop)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Found $count new upstream commit(s)."

      - name: Update sync branch (push via SYNC_PAT triggers CI)
        if: steps.check.outputs.count != '0'
        run: |
          set -euo pipefail
          git branch -f sync/upstream-develop upstream/develop
          git push --force origin sync/upstream-develop

      - name: Open or update sync PR
        if: steps.check.outputs.count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COUNT: ${{ steps.check.outputs.count }}
        run: |
          set -euo pipefail
          git log --oneline --no-merges develop..upstream/develop > commits.txt
          {
            echo "Automated weekly sync from \`upstream/develop\`."
            echo
            echo "### New commits ($COUNT)"
            echo '```'
            cat commits.txt
            echo '```'
            echo
            echo "**Merging:**"
            echo "- Clean → click **Merge**."
            echo "- Conflicts → \`git fetch origin && git checkout sync/upstream-develop\`, resolve, push."
            echo "- After merge: if dependencies changed, run \`./scripts/relock.sh\` and commit \`requirements-dev.lock\`."
            echo
            echo "> ⚠️ This branch is **force-updated every Monday**. If you are resolving conflicts on it, finish before the next run or your pushed resolution will be overwritten."
          } > body.md
          title="Sync upstream develop ($COUNT commits)"
          existing=$(gh pr list --head sync/upstream-develop --base develop --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --title "$title" --body-file body.md
          else
            gh pr create --base develop --head sync/upstream-develop --title "$title" --body-file body.md
          fi
