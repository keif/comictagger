name: Sync upstream develop

on:
  schedule:
    - cron: '0 6 * * 1'  # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

# Serialize runs so an overlapping schedule + manual dispatch cannot both observe
# "no open sync PR" and race into a duplicate-PR POST (the loser would 422).
concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Open sync PR when upstream is ahead
        env:
          # Least privilege: the default token (contents:read + pull-requests:write via
          # the job permissions above) handles the read-only compare/list calls. SYNC_PAT
          # is used ONLY to open the PR, because a PR opened with the default GITHUB_TOKEN
          # does not trigger pull_request CI. So SYNC_PAT needs pull-requests:write only.
          # The PR head is upstream's branch, so its CI runs in the fork pull_request
          # context (no secrets) -- upstream code can never read SYNC_PAT.
          GH_DEFAULT_TOKEN: ${{ github.token }}
          GH_PAT: ${{ secrets.SYNC_PAT }}
        run: |
          set -euo pipefail
          repo="${{ github.repository }}"

          ahead=$(GH_TOKEN="$GH_DEFAULT_TOKEN" gh api "repos/$repo/compare/develop...comictagger:develop" --jq '.ahead_by')
          echo "upstream/develop is ahead by $ahead commit(s)."
          if [ "$ahead" = "0" ]; then
            echo "Nothing to sync."
            exit 0
          fi

          # Idempotent: reuse an existing open sync PR (head = comictagger:develop).
          # A cross-fork PR tracks upstream's branch live, so an open one stays current.
          existing=$(GH_TOKEN="$GH_DEFAULT_TOKEN" gh pr list --repo "$repo" --base develop --state open \
            --json number,headRepositoryOwner,headRefName \
            --jq 'map(select(.headRepositoryOwner.login == "comictagger" and .headRefName == "develop")) | .[0].number // empty')
          if [ -n "$existing" ]; then
            echo "Sync PR #$existing already open; it tracks upstream/develop live. Nothing to do."
            exit 0
          fi

          # Use the REST API rather than `gh pr create`: the API reliably accepts an
          # org-owned cross-repo head (owner:branch), whereas `gh pr create` can reject
          # it. SYNC_PAT (falling back to the default token) opens the PR so pull_request
          # CI fires.
          body="Automated weekly sync from upstream/develop. The PR head is upstream's own develop branch, so it tracks upstream live and its CI runs in the fork pull_request context (read-only token, no secrets). Review the diff and merge when green; never auto-merged. Conflicts: you cannot push to upstream's branch, so merge locally instead (git fetch upstream; git checkout develop; git merge upstream/develop; resolve; git push origin develop) and this PR closes automatically once no diff remains. After merge, if dependencies changed, run ./scripts/relock.sh and commit requirements-dev.lock."
          GH_TOKEN="${GH_PAT:-$GH_DEFAULT_TOKEN}" gh api --method POST "repos/$repo/pulls" \
            -f title="Sync upstream develop ($ahead commits)" \
            -f head="comictagger:develop" \
            -f base="develop" \
            -f body="$body" \
            --jq '.html_url'
